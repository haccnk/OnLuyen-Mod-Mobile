name: onluyen_mod_mobile
description: OnLuyen Mod Mobile v1.0 - Android & iOS Modded WebView Client with Multi-Agent 4-Tier Gemini Solver and 3-Layer Visual Pipeline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.3.3
  http: ^1.2.2
  share_plus: ^11.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/js/inject.js
    - assets/js/dom_extractor_mobile.js
    - assets/js/mobile_agent.js
