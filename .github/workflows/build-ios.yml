name: Build iOS IPA Unsigned (OnLuyen Mod Mobile)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap iOS Xcode Project Scaffolding
        run: |
          mkdir -p /tmp/custom_ios
          cp ios/Runner/Info.plist /tmp/custom_ios/Info.plist
          cp ios/Runner/AppDelegate.swift /tmp/custom_ios/AppDelegate.swift
          cp ios/Podfile /tmp/custom_ios/Podfile

          flutter create --org com.onluyenmod --project-name onluyen_mod_mobile --platforms=ios /tmp/scaffold_ios
          rm -rf ios
          cp -r /tmp/scaffold_ios/ios ./ios

          cp /tmp/custom_ios/Info.plist ios/Runner/Info.plist
          cp /tmp/custom_ios/AppDelegate.swift ios/Runner/AppDelegate.swift
          cp /tmp/custom_ios/Podfile ios/Podfile

          python3 -c '
          import pathlib, re
          pbx = pathlib.Path("ios/Runner.xcodeproj/project.pbxproj")
          target_ver = "15.0"
          if pbx.exists():
              txt = pbx.read_text()
              found = [float(v) for v in re.findall(r"IPHONEOS_DEPLOYMENT_TARGET = ([0-9.]+);", txt)]
              max_existing = max(found) if found else 15.0
              best = max(max_existing, 15.0)
              target_ver = f"{best:.1f}" if best == int(best) else str(best)
              txt = re.sub(r"IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;", f"IPHONEOS_DEPLOYMENT_TARGET = {target_ver};", txt)
              pbx.write_text(txt)
          podfile = pathlib.Path("ios/Podfile")
          if podfile.exists():
              ptxt = podfile.read_text()
              ptxt = re.sub(r"platform :ios,\s*'\''[0-9.]+'\''", f"platform :ios, '\''{target_ver}'\''", ptxt)
              ptxt = ptxt.replace("'\''15.0'\''", f"'\''{target_ver}'\''")
              podfile.write_text(ptxt)
          print("Using iOS deployment target:", target_ver)
          '

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Unsigned iOS App
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into Unsigned .ipa
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -ry ../ipa/OnLuyen_Mod_Mobile-v1.0-unsigned.ipa Payload/
          cd ../../..

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnLuyen-Mod-Mobile-iOS-IPA-Unsigned
          path: build/ios/ipa/OnLuyen_Mod_Mobile-v1.0-unsigned.ipa
          retention-days: 30

      - name: Publish IPA to GitHub Release (v1.0)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 build/ios/ipa/OnLuyen_Mod_Mobile-v1.0-unsigned.ipa \
            --title "OnLuyen Mod Mobile v1.0" \
            --notes "Phiên bản phát hành OnLuyen Mod Mobile v1.0 (Android APK & iOS IPA unsigned). Tải trực tiếp file bên dưới để cài đặt." \
            || gh release upload v1.0 build/ios/ipa/OnLuyen_Mod_Mobile-v1.0-unsigned.ipa --clobber
